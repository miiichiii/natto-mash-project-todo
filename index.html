<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive,noimageindex,nosnippet">
  <meta name="googlebot" content="noindex,nofollow,noarchive,noimageindex,nosnippet">
  <title>Natto_MASH 管理ボード</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./styles.css?v=20260707-ja2">
</head>
<body>
  <header class="topbar">
    <div class="title-block">
      <p class="kicker">Natto_MASH</p>
      <h1>研究管理ボード</h1>
    </div>

    <div class="auth-panel" aria-live="polite">
      <div class="auth-copy">
        <span id="authState" class="auth-state">未ログイン</span>
        <span id="authEmail" class="auth-email"></span>
      </div>
      <button id="loginButton" class="button primary" type="button">Googleでログイン</button>
      <button id="logoutButton" class="button ghost hidden" type="button">ログアウト</button>
    </div>
  </header>

  <main>
    <nav id="viewTabs" class="view-tabs" aria-label="表示切替">
      <button class="view-tab is-active" type="button" data-view="board" aria-selected="true">タスク</button>
      <button class="view-tab hidden" type="button" data-view="budget" aria-selected="false">予算</button>
      <button class="view-tab hidden" type="button" data-view="week" aria-selected="false">来週</button>
    </nav>

    <section id="taskOverview" class="overview" aria-label="進捗状況">
      <div class="metric">
        <span class="metric-label">全タスク</span>
        <strong id="totalCount">0</strong>
      </div>
      <div class="metric">
        <span class="metric-label">完了</span>
        <strong id="doneCount">0</strong>
      </div>
      <div class="metric">
        <span class="metric-label">期限近い</span>
        <strong id="soonCount">0</strong>
      </div>
      <div class="sync-status" id="syncStatus">GitHubタスクを読み込み中</div>
    </section>

    <section id="boardPanel" class="view-panel" aria-label="タスクボード">
      <section id="board" class="board" aria-label="タスクボード"></section>
    </section>

    <section id="budgetPanel" class="view-panel private-panel" aria-label="予算ダッシュボード" hidden>
      <div class="panel-head">
        <div>
          <p class="column-label">内部台帳</p>
          <h2>予算</h2>
        </div>
        <div class="panel-actions">
          <button id="addFundButton" class="button ghost" type="button">資金枠を追加</button>
          <button id="addAllocationButton" class="button ghost" type="button">配分枠を追加</button>
          <button id="addLineItemButton" class="button primary" type="button">支出項目を追加</button>
        </div>
      </div>

      <section id="budgetSummary" class="budget-summary" aria-label="予算サマリー"></section>

      <section class="private-section" aria-label="配分枠">
        <div class="section-head">
          <h3>配分枠</h3>
        </div>
        <div id="allocationTable"></div>
      </section>

      <section class="private-section" aria-label="支出項目">
        <div class="section-head">
          <h3>支出項目</h3>
        </div>
        <div id="lineItemTable"></div>
      </section>

      <section class="private-section" aria-label="更新履歴">
        <div class="section-head">
          <h3>更新履歴</h3>
        </div>
        <ul id="auditLogList" class="audit-list"></ul>
      </section>
    </section>

    <section id="weekPanel" class="view-panel private-panel" aria-label="来週の実行計画" hidden>
      <div class="panel-head">
        <div>
          <p class="column-label">内部実行計画</p>
          <h2>来週</h2>
        </div>
        <div class="panel-actions">
          <button id="addMouseRowButton" class="button ghost" type="button">マウス行を追加</button>
          <button id="addWeeklyItemButton" class="button primary" type="button">行動を追加</button>
        </div>
      </div>

      <section class="private-section" aria-label="週次アクション">
        <div class="section-head">
          <h3>アクション</h3>
        </div>
        <div id="weeklyPlanList" class="weekly-list"></div>
      </section>

      <section class="private-section" aria-label="マウス群分け計画">
        <div class="section-head">
          <h3>マウス群分け計画</h3>
        </div>
        <div id="mouseCohortTable"></div>
      </section>
    </section>
  </main>

  <template id="columnTemplate">
    <section class="column">
      <div class="column-head">
        <div>
          <p class="column-label"></p>
          <h2></h2>
        </div>
        <div class="column-tools">
          <span class="column-count"></span>
          <button class="add-task-button" type="button" title="タスクを追加" aria-label="タスクを追加">+</button>
        </div>
      </div>
      <div class="task-list"></div>
    </section>
  </template>

  <template id="taskTemplate">
    <article class="task-card">
      <label class="check-wrap">
        <input class="task-check" type="checkbox">
        <span class="check-visual" aria-hidden="true"></span>
      </label>
      <div class="task-main">
        <div class="task-meta">
          <span class="tag"></span>
          <time></time>
        </div>
        <h3></h3>
        <p class="task-detail"></p>
        <div class="task-foot">
          <button class="owner owner-button" type="button"></button>
          <span class="state-pill"></span>
        </div>
      </div>
    </article>
  </template>

  <dialog id="taskDialog" class="task-dialog">
    <form id="taskForm" class="task-form">
      <div class="dialog-head">
        <div>
          <p class="column-label">新規タスク</p>
          <h2 id="taskDialogTitle">タスクを追加</h2>
        </div>
        <button id="cancelTaskIconButton" class="icon-button" type="button" aria-label="閉じる">×</button>
      </div>

      <label>
        <span>列</span>
        <select id="taskColumn" name="column" required></select>
      </label>

      <label>
        <span>タイトル</span>
        <input id="taskTitle" name="title" type="text" maxlength="120" required>
      </label>

      <label>
        <span>詳細</span>
        <textarea id="taskDetail" name="detail" rows="4" maxlength="500"></textarea>
      </label>

      <div class="form-grid">
        <label>
          <span>期限</span>
          <input id="taskDue" name="due" type="date">
        </label>
        <label>
          <span>担当</span>
          <input id="taskOwner" name="owner" type="text" maxlength="60">
        </label>
      </div>

      <div class="form-grid">
        <label>
          <span>タグ</span>
          <input id="taskTag" name="tag" type="text" maxlength="40">
        </label>
        <label>
          <span>色</span>
          <select id="taskTone" name="tone">
            <option value="green">緑</option>
            <option value="blue">青</option>
            <option value="red">赤</option>
            <option value="pink">桃</option>
            <option value="gold">金</option>
          </select>
        </label>
      </div>

      <p id="taskFormStatus" class="form-status" aria-live="polite"></p>

      <div class="dialog-actions">
        <button id="cancelTaskButton" class="button ghost" type="button">キャンセル</button>
        <button id="saveTaskButton" class="button primary" type="submit">追加</button>
      </div>
    </form>
  </dialog>

  <dialog id="ownerDialog" class="task-dialog">
    <form id="ownerForm" class="task-form">
      <div class="dialog-head">
        <div>
          <p class="column-label">担当</p>
          <h2 id="ownerDialogTitle">担当を変更</h2>
        </div>
        <button id="cancelOwnerIconButton" class="icon-button" type="button" aria-label="閉じる">×</button>
      </div>

      <label>
        <span>担当表示名</span>
        <input id="ownerName" name="owner" type="text" maxlength="60" required>
      </label>

      <p id="ownerFormStatus" class="form-status" aria-live="polite"></p>

      <div class="dialog-actions split-actions">
        <button id="useGoogleNameButton" class="button ghost" type="button">Google名にする</button>
        <div class="action-pair">
          <button id="cancelOwnerButton" class="button ghost" type="button">キャンセル</button>
          <button id="saveOwnerButton" class="button primary" type="submit">保存</button>
        </div>
      </div>
    </form>
  </dialog>

  <dialog id="privateDialog" class="task-dialog wide-dialog">
    <form id="privateForm" class="task-form">
      <div class="dialog-head">
        <div>
          <p class="column-label">内部記録</p>
          <h2 id="privateDialogTitle">追加</h2>
        </div>
        <button id="cancelPrivateIconButton" class="icon-button" type="button" aria-label="閉じる">×</button>
      </div>

      <div id="privateFields" class="private-fields"></div>

      <p id="privateFormStatus" class="form-status" aria-live="polite"></p>

      <div class="dialog-actions">
        <button id="cancelPrivateButton" class="button ghost" type="button">キャンセル</button>
        <button id="savePrivateButton" class="button primary" type="submit">追加</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="./app.js?v=20260707-ja2"></script>
</body>
</html>
